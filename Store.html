<script>
  /**
   * Store.html
   * Único objeto de estado global de la aplicación (sección 7 del documento
   * maestro). Ningún otro archivo debe crear variables globales adicionales:
   * todo lo que necesite sobrevivir entre funciones vive aquí dentro.
   *
   * Se declara con "const" UNA sola vez en todo el proyecto. El resto de los
   * módulos solo leen o mutan sus propiedades (Store.dashboard = ...), nunca
   * lo vuelven a declarar (eso rompería la app con un SyntaxError).
   */
  const Store = {
    usuarioActual: {},
    // ID_Usuario (entero) del usuario de la sesión. Es la identidad interna; el
    // nombre (usuarioActual.Nombre) solo se usa para mostrar.
    idUsuarioActual: null,
    dashboard: {},
    // Todos los IDs de los catálogos son ENTEROS. Se incluyen también los
    // elementos inactivos (activa === false): sirven para mostrar el histórico;
    // los selectores de "nuevo movimiento" los filtran.
    catalogos: {
      usuarios: [],
      cuentas: [],
      categorias: [],
      subcategorias: [],
      presupuestos: []
    },
    movimientos: [],
    // Gestión de cuentas: las cuentas del usuario con sus saldos/deuda calculados y los totales.
    cuentasUsuario: [],
    resumenCuentas: null,
    shared: {
      esMultiUsuario: false
    },
    meta: {
      pantallaActual: 'inicio',
      historialCargado: false,
      historialOffset: 0,
      historialHayMas: true,
      tamanoPagina: 10,
      analisisCargado: false,
      cuentasCargadas: false
    }
  };
</script>
